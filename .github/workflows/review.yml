name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formula:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: ruby -c Formula/watasu.rb
